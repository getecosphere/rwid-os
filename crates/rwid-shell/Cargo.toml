[package]
name = "rwid-shell"
version = "0.2.0"
edition = "2024"
description = "RWID/OS shell host: the ecOS desktop full screen in WebKitGTK on a layer-shell surface (blueprint §6.4)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
webkit6 = "0.6"
gio-unix = "0.22"
gtk4-layer-shell = "0.8"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["json"] }
